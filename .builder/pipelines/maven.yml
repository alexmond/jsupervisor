name: Java CI with Maven

on: [push, manual]
checkout: true
push:
  branches: [main]

jobs:
  build:
    image: maven:3.9-eclipse-temurin-21
    cache:
      key: m2-jsupervisor
      paths: [.m2/repository]
    steps:
      - name: Build with Maven
        run: mvn -B package --file pom.xml -Pdefault --no-transfer-progress -Dmaven.repo.local=.m2/repository
    artifacts:
      - "**/surefire-reports/TEST-*.xml"
